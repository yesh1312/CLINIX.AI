# Server Configuration
server.port=8080
server.address=0.0.0.0

# Logging Configuration
logging.level.org.springframework.web=DEBUG
logging.level.com.clinixai=DEBUG

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Database Configuration (H2 In-Memory for Cloud Stability)
spring.datasource.url=jdbc:h2:mem:clinixdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Google OAuth2 Configuration
# Instructions: Replace the placeholders below with your actual Google Client ID and Secret
# from https://console.cloud.google.com/
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=profile,email

# CLINIX.AI Intelligence Configuration
clinixai.llm.active-provider=gemini
clinixai.llm.gemini.api-key=AIzaSyBDdQmr9uRtDHuBVMfFuTEQe3kHPQx4b20
clinixai.analysis.use-onnx=true
