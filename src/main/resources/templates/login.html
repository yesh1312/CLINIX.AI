<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CLINIX.AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --sheet: #0c0f16;
            --primary: #e63939;
            --primary-glow: rgba(230, 57, 57, 0.4);
            --text-main: #f0f2f5;
            --text-dim: #9ba1ad;
            --border: rgba(255, 255, 255, 0.08);
            --rx: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Animated Background Elements */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            z-index: 0;
            opacity: 0.5;
            filter: blur(80px);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--sheet);
            border: 1px solid var(--border);
            border-radius: var(--rx);
            padding: 48px 40px;
            position: relative;
            z-index: 10;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .brand-icon {
            font-size: 40px;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 10px var(--primary-glow));
        }

        .brand-name {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: -0.5px;
        }

        .brand-name em {
            color: var(--primary);
            font-style: normal;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-dim);
            margin-top: 8px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
            color: white;
            font-size: 15px;
            transition: all 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .login-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--primary-glow);
            filter: brightness(1.1);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-msg {
            background: rgba(230, 57, 57, 0.1);
            border: 1px solid rgba(230, 57, 57, 0.2);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 24px;
            display: none;
            text-align: center;
        }

        .footer-text {
            margin-top: 32px;
            text-align: center;
            font-size: 12px;
            color: var(--text-dim);
        }

        /* Loading Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading .spinner {
            display: block;
        }

        .loading .btn-text {
            display: none;
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>

    <div class="login-card">
        <div class="brand">
            <div class="brand-icon">🧠</div>
            <div class="brand-name">CLINIX<em>.AI</em></div>
            <div class="subtitle">Medical Intelligence Portal</div>
        </div>

        <div id="error" class="error-msg">Invalid username or password</div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="label">Username</label>
                <div class="input-wrap">
                    <input type="text" id="username" placeholder="Enter your username" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label class="label">Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="••••••••" required
                        autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span class="spinner"></span>
                <span class="btn-text">Sign In to Dashboard</span>
            </button>
        </form>

        <div class="divider"
            style="display: flex; align-items: center; text-align: center; margin: 24px 0; color: var(--text-dim); font-size: 12px;">
            <style>
                .divider::before,
                .divider::after {
                    content: '';
                    flex: 1;
                    border-bottom: 1px solid var(--border);
                }

                .divider:not(:empty)::before {
                    margin-right: .75em;
                }

                .divider:not(:empty)::after {
                    margin-left: .75em;
                }
            </style>
            OR
        </div>

        <a href="/oauth2/authorization/google" class="google-btn"
            style="width: 100%; background: transparent; color: white; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;">
            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="18" height="18"
                alt="Google Logo">
            Continue with Google
        </a>

        <div class="footer-text">
            Don't have a professional account? <a href="/register"
                style="color: var(--primary); text-decoration: none; font-weight: 600;">Register Now</a>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('error');
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            btn.classList.add('loading');
            err.style.display = 'none';

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await resp.json();

                if (resp.ok && data.status === 'success') {
                    // Redirect to home on success
                    window.location.href = '/';
                } else {
                    err.style.display = 'block';
                    err.textContent = data.message || 'Authentication failed';
                }
            } catch (error) {
                err.style.display = 'block';
                err.textContent = 'Connection error. Please try again.';
            } finally {
                btn.classList.remove('loading');
            }
        }

        function continueWithGoogle() {
            window.location.href = '/oauth2/authorization/google';
        }

        // Auto-focus username
        document.getElementById('username').focus();
    </script>
</body>

</html>
