<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CLINIX.AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --sheet: #0c0f16;
            --primary: #e63939;
            --primary-glow: rgba(230, 57, 57, 0.4);
            --text-main: #f0f2f5;
            --text-dim: #9ba1ad;
            --border: rgba(255, 255, 255, 0.08);
            --rx: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            bottom: -200px;
            left: -200px;
            z-index: 0;
            opacity: 0.3;
            filter: blur(80px);
        }

        .login-card {
            width: 100%;
            max-width: 480px;
            background: var(--sheet);
            border: 1px solid var(--border);
            border-radius: var(--rx);
            padding: 40px;
            position: relative;
            z-index: 10;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            font-size: 32px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 10px var(--primary-glow));
        }

        .brand-name {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.5px;
        }

        .brand-name em {
            color: var(--primary);
            font-style: normal;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 6px;
            font-weight: 400;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full {
            grid-column: span 2;
        }

        .label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            color: white;
            font-size: 14px;
            transition: all 0.2s;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .login-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--primary-glow);
        }

        .google-btn {
            width: 100%;
            background: transparent;
            color: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .google-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-dim);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider:not(:empty)::before {
            margin-right: .75em;
        }

        .divider:not(:empty)::after {
            margin-left: .75em;
        }

        .error-msg {
            background: rgba(230, 57, 57, 0.1);
            border: 1px solid rgba(230, 57, 57, 0.2);
            color: #ff6b6b;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .success-msg {
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid rgba(0, 230, 118, 0.2);
            color: #00e676;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .footer-text {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--text-dim);
        }

        .footer-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading .spinner {
            display: block;
        }

        .loading .btn-text {
            display: none;
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>

    <div class="login-card">
        <div class="brand">
            <div class="brand-icon">🔬</div>
            <div class="brand-name">CLINIX<em>.AI</em></div>
            <div class="subtitle">Clinical Account Registration</div>
        </div>

        <div id="error" class="error-msg"></div>
        <div id="success" class="success-msg"></div>

        <form id="regForm" onsubmit="handleRegister(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label class="label">Username</label>
                    <input type="text" id="username" placeholder="jdoe_admin" required>
                </div>
                <div class="form-group">
                    <label class="label">Full Name</label>
                    <input type="text" id="fullName" placeholder="Dr. John Doe" required>
                </div>
                <div class="form-group full">
                    <label class="label">Email Address</label>
                    <input type="email" id="email" placeholder="john.doe@hospital.com" required>
                </div>
                <div class="form-group">
                    <label class="label">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label class="label">Clinical Role</label>
                    <select id="role">
                        <option value="CLINICIAN">Clinician</option>
                        <option value="RADIOLOGIST">Radiologist</option>
                        <option value="RESEARCHER">Researcher</option>
                        <option value="ADMIN">Administrator</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="login-btn" id="regBtn">
                <span class="spinner"></span>
                <span class="btn-text">Create Professional Account</span>
            </button>
        </form>

        <div class="divider">OR</div>

        <a href="/oauth2/authorization/google" class="google-btn" style="text-decoration: none;">
            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="18" height="18"
                alt="Google Logo">
            Continue with Google
        </a>

        <div class="footer-text">
            Already have an account? <a href="/login">Sign In</a>
        </div>
    </div>

    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            const err = document.getElementById('error');
            const succ = document.getElementById('success');

            const payload = {
                username: document.getElementById('username').value,
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };

            btn.classList.add('loading');
            err.style.display = 'none';
            succ.style.display = 'none';

            try {
                const resp = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await resp.json();

                if (resp.ok && data.status === 'success') {
                    succ.style.display = 'block';
                    succ.textContent = 'Registration successful! Redirecting to login...';
                    setTimeout(() => window.location.href = '/login', 2000);
                } else {
                    err.style.display = 'block';
                    err.textContent = data.message || 'Registration failed';
                }
            } catch (error) {
                err.style.display = 'block';
                err.textContent = 'Connection error. Please try again.';
            } finally {
                btn.classList.remove('loading');
            }
        }

        function continueWithGoogle() {
            window.location.href = '/oauth2/authorization/google';
        }

        document.getElementById('username').focus();
    </script>
</body>

</html>
